<text x="155" y="182"><tspan class="k">function</tspan><tspan class="t"> binarySearch(arr, x) {</tspan></text>
<text x="155" y="208"><tspan class="t">  </tspan><tspan class="k">let</tspan><tspan class="t"> lo = </tspan><tspan class="s">0</tspan><tspan class="t">, hi = arr.length - </tspan><tspan class="s">1</tspan><tspan class="t">;</tspan></text>
<text x="155" y="234"><tspan class="t">  </tspan><tspan class="k">while</tspan><tspan class="t"> (lo &lt;= hi) {</tspan></text>
<text x="155" y="260"><tspan class="t">    </tspan><tspan class="k">const</tspan><tspan class="t"> mid = (lo + hi) &gt;&gt; </tspan><tspan class="s">1</tspan><tspan class="t">;</tspan></text>
<text x="155" y="286"><tspan class="t">    </tspan><tspan class="k">if</tspan><tspan class="t"> (arr[mid] === x) </tspan><tspan class="k">return</tspan><tspan class="t"> mid;</tspan></text>
<text x="155" y="312"><tspan class="t">    arr[mid] &lt; x ? lo = mid + </tspan><tspan class="s">1</tspan></text>
<text x="155" y="338"><tspan class="t">                 : hi = mid - </tspan><tspan class="s">1</tspan><tspan class="t">;</tspan></text>
<text x="155" y="364" class="t">  }</text>
<text x="155" y="390"><tspan class="t">  </tspan><tspan class="k">return</tspan><tspan class="t"> -</tspan><tspan class="s">1</tspan><tspan class="t">;</tspan></text>
<text x="155" y="416" class="t">}</text>
